[tool.poetry]
name = "tap-flowpay-universal"
version = "1.1.0"
description = "Singer tap for FlowpayUniversal, built with the Meltano Singer SDK."
readme = "README.md"
authors = ["hotglue <hello@hotglue.io>"]
keywords = [
    "ELT",
    "FlowpayUniversal",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.7.1,<3.11"
importlib-resources = { version = "5.12.0", python = "<3.9" }
singer-sdk = { version="~=0.5.0", extras = [] }
fs-s3fs = { version = "~=1.1.1", optional = true }
requests = "2.29.0"

[tool.poetry.extras]
s3 = ["fs-s3fs"]

[tool.pytest.ini_options]
addopts = '--durations=10'

[tool.mypy]
python_version = ">=3.8"
warn_unused_configs = true

[tool.ruff]
src = ["tap_flowpay_universal"]
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
]
select = ["ALL"]
line-length = 100

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["tap_flowpay_universal"]
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core==1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-flowpay-universal = 'tap_flowpay_universal.tap:TapFlowpayUniversal.cli'

[dependency-groups]
dev = [
    "pytest (>=7.0,<8.0)"
]
